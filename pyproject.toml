[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-quality-lab"
version = "2.0.0"
requires-python = ">=3.9"
dependencies = ["fastapi==0.128.8", "uvicorn==0.39.0", "httpx==0.28.1"]
[tool.setuptools.packages.find]
include = ["platform_lab*", "quality_lab*"]
