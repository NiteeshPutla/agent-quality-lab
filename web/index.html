<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Quality Lab</title>
<style>body{background:#101620;color:#e5ecf4;font:16px system-ui;max-width:1100px;margin:50px auto;padding:0 24px}h1{font-size:42px}p{color:#aebdd0}section{background:#1b2635;border:1px solid #344359;padding:24px;border-radius:14px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #344359}small{color:#8edacc}code{white-space:pre-wrap}button{padding:10px 20px;cursor:pointer}</style>
<h1>Agent Quality Lab</h1><p>Measure → diagnose → improve → verify</p><small>OFFLINE SIMULATION · NO LIVE MODEL CALLS · SYNTHETIC DATA</small>
<p>Scores are exact-term coverage gated by safety and citation checks. Latency measures local Python execution; cost is zero. These are not model benchmarks.</p>
<button onclick="load()">Refresh runs</button><main id="runs"></main>
<script>
async function load(){const root=document.querySelector('#runs');root.replaceChildren();try{const data=await(await fetch('/api/runs')).json();if(!data.length)root.textContent='Run python3 -m quality_lab demo to generate results.';for(const item of data){const s=document.createElement('section');const h=document.createElement('h2');h.textContent=item.name+' · '+(item.run.mean_quality*100).toFixed(0)+'%';s.append(h);const p=document.createElement('p');p.textContent='Split: '+item.run.split+' · Route: '+item.run.route;s.append(p);const t=document.createElement('table');const header=t.insertRow();for(const label of ['Case','Category','Quality','Provider','Local ms']){const th=document.createElement('th');th.textContent=label;header.append(th)}for(const r of item.run.rows){const tr=t.insertRow();for(const v of [r.id,r.category,r.scores.quality.toFixed(2),r.trace.provider,r.trace.latency_ms.toFixed(2)])tr.insertCell().textContent=v}const d=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Inspect traces';d.append(summary);const code=document.createElement('code');code.textContent=JSON.stringify(item.run.rows,null,2);d.append(code);s.append(t,d);root.append(s)}}catch(e){root.textContent='Could not load results: '+e.message}}
load();
</script></html>
